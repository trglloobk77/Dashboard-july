name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen project
        run: unzip -o BotViperApp.zip -d .

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        working-directory: BotViperApp
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BotViperApp-debug-apk
          path: BotViperApp/app/build/outputs/apk/debug/app-debug.apk
          
